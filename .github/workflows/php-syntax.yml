name: PHP syntax

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly: catch Google for WooCommerce releases that change the hooks the
  # Google Merchant Policy module depends on, even without a commit here.
  schedule:
    - cron: '17 9 * * 1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: |
          set -e
          find . -name '*.php' ! -path './.git/*' ! -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Pickup and native FFL checkout regression checks
        run: |
          set -e
          php tests/smoke/pickup-shipping-smoke.php
          php tests/smoke/pickup-shipping-internal-rates-smoke.php
          php tests/smoke/pickup-shipping-native-conflict-smoke.php
          php tests/smoke/pickup-shipping-smoke.php missing-provider
          php tests/smoke/pickup-shipping-transitions-smoke.php

      - name: Tax filing and Split Payment reporting regression checks
        run: |
          php tests/smoke/tax-report-jurisdiction-smoke.php
          php tests/smoke/tax-split-payment-smoke.php
          php tests/smoke/tax-order-context-smoke.php
          php tests/smoke/tax-report-shipping-fee-smoke.php

      - name: Google Merchant policy and Google for WooCommerce compatibility
        run: |
          set -e
          curl -fsSL -o /tmp/class-wp-hook.php https://raw.githubusercontent.com/WordPress/WordPress/master/wp-includes/class-wp-hook.php
          php tests/smoke/google-merchant-policy-smoke.php /tmp/class-wp-hook.php
          GLA_VERSION=$(curl -fsSL 'https://api.wordpress.org/plugins/info/1.2/?action=plugin_information&request%5Bslug%5D=google-listings-and-ads' | php -r 'echo json_decode(stream_get_contents(STDIN), true)["version"];')
          curl -fsSL -o /tmp/gla.zip "https://downloads.wordpress.org/plugin/google-listings-and-ads.${GLA_VERSION}.zip"
          unzip -q /tmp/gla.zip -d /tmp/gla
          php tests/smoke/google-merchant-gla-contract.php /tmp/gla/google-listings-and-ads

      - name: Customer and order management regression checks
        run: |
          php tests/smoke/customer-operations-smoke.php
          node tests/smoke/customer-operations-endpoints-smoke.js
